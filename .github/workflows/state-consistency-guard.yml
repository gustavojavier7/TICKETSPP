name: State Consistency Guard

on:
  schedule:
    # Misma ronda operativa que los recordatorios de inactividad.
    - cron: '15 */8 * * *'

  workflow_dispatch:

permissions:
  issues: write

jobs:
  reconcile_state:
    name: Reconcile issue state and state labels
    runs-on: ubuntu-latest

    steps:
      - name: Detect, notify and repair state inconsistencies
        uses: actions/github-script@v8
        with:
          script: |
            const REPAIR_MARKER = 'state-consistency-repair-v1';
            const CLOSED_LABEL = 'estado:cerrado';
            const STATE_PREFIX = 'estado:';

            const STATE_FROM_BODY = {
              ABIERTO: 'estado:abierto',
              'EN CURSO': 'estado:en-curso',
              'ESPERANDO RESPUESTA': 'estado:esperando-respuesta'
            };

            const counters = {
              checked: 0,
              consistent: 0,
              closedLabelRepaired: 0,
              issueClosedFromLabel: 0,
              bodyStateRepaired: 0,
              missingBodyState: 0,
              multipleStateLabels: 0,
              inconsistent: 0,
              errors: 0
            };

            function labelNames(issue) {
              return (issue.labels || [])
                .map(label =>
                  typeof label === 'string' ? label : label.name
                )
                .filter(Boolean);
            }

            function stateFromIssueBody(body) {
              const text = body || '';
              const match = text.match(
                /###\s+ESTADO DEL TICKET\s*\n+\s*(ABIERTO|EN CURSO|ESPERANDO RESPUESTA)\b/i
              );

              if (!match) {
                return null;
              }

              return STATE_FROM_BODY[match[1].toUpperCase()] || null;
            }

            function canonicalLabels(labels, targetStateLabel) {
              const preserved = labels.filter(label =>
                !label.toLowerCase().startsWith(STATE_PREFIX)
              );

              return [
                ...new Set([
                  ...preserved,
                  targetStateLabel
                ])
              ];
            }

            async function createRepairComment(issue, body) {
              const response = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body
              });

              return response.data.id;
            }

            async function updateRepairComment(commentId, body) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: commentId,
                body
              });
            }

            async function markFailure(commentId, issue, message, details) {
              if (commentId === null) {
                return;
              }

              const failureBody = [
                `<!-- ${REPAIR_MARKER} -->`,
                '❌ **Inconsistencia de estado detectada, pero la reparación automática falló**',
                '',
                message,
                '',
                ...details,
                '',
                'La inconsistencia sigue visible y la próxima ronda volverá a intentar la corrección.'
              ].join('\n');

              try {
                await updateRepairComment(commentId, failureBody);
              } catch (commentError) {
                core.error(
                  `Issue #${issue.number}: tampoco pudo actualizarse el aviso de fallo: ${commentError.message}`
                );
              }
            }

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 100
              }
            );

            core.info(`Issues recuperados: ${issues.length}`);

            for (const issue of issues) {
              if (issue.pull_request) {
                continue;
              }

              counters.checked++;

              const labelsBefore = labelNames(issue);
              const previousStateLabels = labelsBefore.filter(label =>
                label.toLowerCase().startsWith(STATE_PREFIX)
              );
              const hasClosedLabel = previousStateLabels.some(label =>
                label.toLowerCase() === CLOSED_LABEL
              );
              const hasCanonicalClosedState =
                previousStateLabels.length === 1 &&
                previousStateLabels[0].toLowerCase() === CLOSED_LABEL;

              /*
               * Regla A:
               * GitHub CLOSED es fuente de verdad para un Issue ya cerrado.
               */
              if (issue.state === 'closed' && !hasCanonicalClosedState) {
                counters.inconsistent++;

                const detectionBody = [
                  `<!-- ${REPAIR_MARKER} -->`,
                  '⚠️ **Inconsistencia de estado detectada**',
                  '',
                  'El Issue está **closed** en GitHub, pero sus etiquetas de estado no eran canónicas.',
                  '',
                  `Etiquetas de estado detectadas: ${
                    previousStateLabels.length > 0
                      ? previousStateLabels.map(label => `\`${label}\``).join(', ')
                      : 'ninguna'
                  }.`,
                  '',
                  `🔧 **Acción automática iniciada:** reemplazar cualquier etiqueta \`${STATE_PREFIX}*\` por \`${CLOSED_LABEL}\`.`
                ].join('\n');

                let commentId = null;

                try {
                  commentId = await createRepairComment(issue, detectionBody);

                  await github.rest.issues.setLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    labels: canonicalLabels(labelsBefore, CLOSED_LABEL)
                  });

                  const successBody = [
                    `<!-- ${REPAIR_MARKER} -->`,
                    '✅ **Inconsistencia de estado corregida automáticamente**',
                    '',
                    'El Issue ya estaba **closed** en GitHub, pero sus etiquetas de estado eran inconsistentes.',
                    '',
                    `Acción realizada: se eliminó cualquier \`${STATE_PREFIX}*\` anterior y se asignó \`${CLOSED_LABEL}\`.`
                  ].join('\n');

                  await updateRepairComment(commentId, successBody);
                  counters.closedLabelRepaired++;
                } catch (error) {
                  counters.errors++;
                  await markFailure(
                    commentId,
                    issue,
                    `El Issue está **closed** en GitHub y debería conservar únicamente \`${CLOSED_LABEL}\`.`,
                    [`Error: \`${error.message}\``]
                  );
                }

                continue;
              }

              /*
               * Regla B:
               * estado:cerrado sobre un Issue OPEN es una orden operativa de cierre.
               */
              if (issue.state === 'open' && hasClosedLabel) {
                counters.inconsistent++;

                const detectionBody = [
                  `<!-- ${REPAIR_MARKER} -->`,
                  '⚠️ **Inconsistencia de estado detectada**',
                  '',
                  `El Issue seguía **open** en GitHub, pero tenía la etiqueta operativa \`${CLOSED_LABEL}\`.`,
                  '',
                  '🔧 **Acción automática iniciada:** cerrar el Issue y conservar únicamente `estado:cerrado`.'
                ].join('\n');

                let commentId = null;

                try {
                  commentId = await createRepairComment(issue, detectionBody);

                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    state: 'closed'
                  });

                  await github.rest.issues.setLabels({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    labels: canonicalLabels(labelsBefore, CLOSED_LABEL)
                  });

                  const successBody = [
                    `<!-- ${REPAIR_MARKER} -->`,
                    '✅ **Inconsistencia de estado corregida automáticamente**',
                    '',
                    `El Issue estaba **open** en GitHub pero tenía \`${CLOSED_LABEL}\`.`,
                    '',
                    'Acciones realizadas:',
                    '- El Issue fue cerrado automáticamente en GitHub.',
                    `- Se eliminaron labels \`${STATE_PREFIX}*\` contradictorias y se conservó \`${CLOSED_LABEL}\`.`
                  ].join('\n');

                  await updateRepairComment(commentId, successBody);
                  counters.issueClosedFromLabel++;
                } catch (error) {
                  counters.errors++;
                  await markFailure(
                    commentId,
                    issue,
                    `El Issue estaba **open** en GitHub pero tenía \`${CLOSED_LABEL}\`.`,
                    [`Error: \`${error.message}\``]
                  );
                }

                continue;
              }

              if (issue.state !== 'open') {
                counters.consistent++;
                continue;
              }

              const expectedStateLabel = stateFromIssueBody(issue.body);

              if (!expectedStateLabel) {
                counters.missingBodyState++;
                counters.errors++;

                core.error(
                  `Issue #${issue.number}: no se pudo obtener un estado válido desde el cuerpo.`
                );

                continue;
              }

              /*
               * Regla C - Fallar Primero:
               * más de una etiqueta estado:* es una contradicción estructural.
               * No se adivina cuál era la intención; se registra el error.
               */
              if (previousStateLabels.length > 1) {
                counters.multipleStateLabels++;
                counters.inconsistent++;
                counters.errors++;

                core.error(
                  `Issue #${issue.number}: múltiples etiquetas de estado: ${previousStateLabels.join(', ')}`
                );

                continue;
              }

              const currentStateLabel = previousStateLabels[0] || null;

              if (currentStateLabel === expectedStateLabel) {
                counters.consistent++;
                continue;
              }

              counters.inconsistent++;

              const detectionBody = [
                `<!-- ${REPAIR_MARKER} -->`,
                '⚠️ **Inconsistencia entre estado declarado y etiqueta detectada**',
                '',
                `Estado declarado en \`### ESTADO DEL TICKET\`: \`${expectedStateLabel}\`.`,
                `Etiqueta de estado actual: ${
                  currentStateLabel ? `\`${currentStateLabel}\`` : 'ninguna'
                }.`,
                '',
                `🔧 **Acción automática iniciada:** dejar únicamente \`${expectedStateLabel}\`.`
              ].join('\n');

              let commentId = null;

              try {
                commentId = await createRepairComment(issue, detectionBody);

                await github.rest.issues.setLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: canonicalLabels(labelsBefore, expectedStateLabel)
                });

                const successBody = [
                  `<!-- ${REPAIR_MARKER} -->`,
                  '✅ **Estado operativo reconciliado automáticamente**',
                  '',
                  `Fuente usada: \`### ESTADO DEL TICKET\` del cuerpo del Issue.`,
                  `Etiqueta anterior: ${
                    currentStateLabel ? `\`${currentStateLabel}\`` : 'ninguna'
                  }.`,
                  `Etiqueta final: \`${expectedStateLabel}\`.`
                ].join('\n');

                await updateRepairComment(commentId, successBody);
                counters.bodyStateRepaired++;

                core.info(
                  `Issue #${issue.number}: estado reconciliado -> ${expectedStateLabel}`
                );
              } catch (error) {
                counters.errors++;

                await markFailure(
                  commentId,
                  issue,
                  'No se pudo reconciliar la etiqueta de estado con el valor declarado en el cuerpo.',
                  [
                    `Estado esperado: \`${expectedStateLabel}\`.`,
                    `Error: \`${error.message}\``
                  ]
                );
              }
            }

            core.info(
              `Resumen: revisados=${counters.checked}, ` +
              `consistentes=${counters.consistent}, ` +
              `inconsistentes=${counters.inconsistent}, ` +
              `labels_cierre_reparadas=${counters.closedLabelRepaired}, ` +
              `issues_cerrados_por_label=${counters.issueClosedFromLabel}, ` +
              `estados_reparados_desde_cuerpo=${counters.bodyStateRepaired}, ` +
              `estado_cuerpo_invalido=${counters.missingBodyState}, ` +
              `multiples_labels_estado=${counters.multipleStateLabels}, ` +
              `errores=${counters.errors}`
            );

            if (counters.errors > 0) {
              core.setFailed(
                `Hubo ${counters.errors} error(es) al reconciliar estados.`
              );
            }
