name: Manual Inactivity Dispatch Test

on:
  push:
    paths:
      - '.github/manual-inactivity-test.trigger'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch inactivity-reminders on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run inactivity-reminders.yml \
            --repo "${{ github.repository }}" \
            --ref main
