name: Inactivity Reminders

on:
  schedule:
    # Curso normal: cada 8 horas, al minuto 15.
    # Argentina: aproximadamente 05:15, 13:15 y 21:15.
    - cron: '15 */8 * * *'

  # Permite ejecutar el recordatorio manualmente desde Actions.
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    name: Probabilistic inactivity triage
    runs-on: ubuntu-latest

    steps:
      - name: Check inactivity and send reminders
        uses: actions/github-script@v8
        with:
          script: |
            const DAY_MS = 24 * 60 * 60 * 1000;
            const HOUR_MS = 60 * 60 * 1000;
            const now = Date.now();

            const PAUSE_MS = 7 * DAY_MS;

            const REMINDER_MARKER = 'recordatorio-inactividad-v1';
            const CODEX_MARKER = 'codex-review-inactivity-v1';
            const VALIDATION_MARKER =
              'codex-connector-ticket-validation-v1';
            const HUMAN_ACTIVITY_PATTERN =
              /<!-- human-activity-v1:([^>]+) -->/g;

            const AUTO_MARKERS = [
              REMINDER_MARKER,
              CODEX_MARKER
            ];

            const HUMAN_TIMELINE_EVENTS = new Set([
              'edited',
              'renamed',
              'closed',
              'reopened',
              'labeled',
              'unlabeled',
              'assigned',
              'unassigned',
              'milestoned',
              'demilestoned',
              'locked',
              'unlocked',
              'pinned',
              'unpinned'
            ]);

            /*
             * Configuración por prioridad:
             *
             * inactivityMs:
             * tiempo mínimo de inactividad para ser elegible.
             *
             * p:
             * probabilidad de enviar el aviso en cada ejecución elegible.
             *
             * mode:
             * tipo de comentario que se publicará.
             */
            const cfg = {
              'prioridad:urgente': {
                inactivityMs: 24 * HOUR_MS,
                p: 3 / 4,
                mode: 'codex'
              },

              'prioridad:alta': {
                inactivityMs: 48 * HOUR_MS,
                p: 2 / 3,
                mode: 'codex'
              },

              'prioridad:media': {
                inactivityMs: 7 * DAY_MS,
                p: 1 / 2,
                mode: 'normal'
              },

              'prioridad:baja': {
                inactivityMs: 28 * DAY_MS,
                p: 1 / 6,
                mode: 'normal'
              }
            };

            const auditLog = [];

            const counters = {
              checked: 0,
              notified: 0,
              normalNotified: 0,
              codexReviewed: 0,
              skippedPullRequests: 0,
              skippedClosedLabel: 0,
              missingPriority: 0,
              insufficientInactivity: 0,
              pausedByHuman: 0,
              pausedByAutomation: 0,
              randomRejected: 0,
              errors: 0
            };

            function days(ms) {
              return Number((ms / DAY_MS).toFixed(2));
            }

            function probability(value) {
              return Number(value.toFixed(4));
            }

            function isoDate(ms) {
              if (!Number.isFinite(ms)) {
                return null;
              }

              return new Date(ms).toISOString();
            }

            function formatArgentinaDate(ms) {
              return new Intl.DateTimeFormat('es-AR', {
                timeZone: 'America/Argentina/Buenos_Aires',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit'
              }).format(new Date(ms));
            }

            function timeMs(value) {
              const parsed = new Date(value).getTime();
              return Number.isFinite(parsed) ? parsed : null;
            }

            function writeDecision(entry) {
              auditLog.push(entry);

              const parts = [
                `Issue #${entry.issue}`,
                `decisión=${entry.decision}`,
                `causa=${entry.reason}`
              ];

              if (entry.priority) {
                parts.push(`prioridad=${entry.priority}`);
              }

              if (entry.inactiveDays !== undefined) {
                parts.push(`inactividad=${entry.inactiveDays}d`);
              }

              if (entry.requiredDays !== undefined) {
                parts.push(`mínimo=${entry.requiredDays}d`);
              }

              if (entry.lastHumanActivitySource) {
                parts.push(
                  `actividad=${entry.lastHumanActivitySource}`
                );
              }

              if (entry.configuredProbability !== undefined) {
                parts.push(
                  `probabilidad=${entry.configuredProbability}`
                );
              }

              if (entry.randomValue !== undefined) {
                parts.push(`sorteo=${entry.randomValue}`);
              }

              if (entry.mode) {
                parts.push(`modo=${entry.mode}`);
              }

              if (entry.resumeAt) {
                parts.push(`reanuda=${entry.resumeAt}`);
              }

              core.info(parts.join(' | '));
            }

            core.info(
              `Inicio del análisis: ${new Date(now).toISOString()}`
            );

            core.info(
              `Evento: ${context.eventName}; ` +
              `cron: ${context.payload.schedule || 'manual/no disponible'}`
            );

            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              }
            );

            core.info(
              `Elementos abiertos recuperados: ${issues.length}`
            );

            for (const issue of issues) {
              if (issue.pull_request) {
                counters.skippedPullRequests++;

                writeDecision({
                  issue: issue.number,
                  title: issue.title,
                  decision: 'OMITIDO',
                  reason: 'es_pull_request'
                });

                continue;
              }

              counters.checked++;

              const labels = (issue.labels || [])
                .map(label =>
                  typeof label === 'string'
                    ? label
                    : label.name
                )
                .filter(Boolean);

              if (labels.includes('estado:cerrado')) {
                counters.skippedClosedLabel++;

                writeDecision({
                  issue: issue.number,
                  title: issue.title,
                  decision: 'NO_ELEGIBLE',
                  reason: 'etiqueta_estado_cerrado'
                });

                continue;
              }

              const priorityLabel = Object.keys(cfg)
                .find(priority => labels.includes(priority));

              if (!priorityLabel) {
                counters.missingPriority++;

                writeDecision({
                  issue: issue.number,
                  title: issue.title,
                  decision: 'NO_ELEGIBLE',
                  reason: 'falta_etiqueta_prioridad',
                  labels
                });

                continue;
              }

              const {
                inactivityMs,
                p,
                mode
              } = cfg[priorityLabel];

              try {
                const comments = await github.paginate(
                  github.rest.issues.listComments,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    per_page: 100
                  }
                );

                const timelineEvents = await github.paginate(
                  github.rest.issues.listEventsForTimeline,
                  {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    per_page: 100
                  }
                );

                /*
                 * La actividad humana incluye:
                 * - creación del ticket;
                 * - comentarios humanos y sus ediciones;
                 * - ediciones del Issue registradas por el workflow
                 *   de formalización mediante marcador oculto;
                 * - cambios humanos de estado, labels, título,
                 *   asignación y otros eventos administrativos.
                 *
                 * Se excluyen explícitamente actores Bot para que
                 * las automatizaciones no reinicien el reloj.
                 */
                const activityCandidates = [];

                const createdMs = timeMs(issue.created_at);
                if (createdMs !== null) {
                  activityCandidates.push({
                    ms: createdMs,
                    source: 'creacion_issue'
                  });
                }

                for (const comment of comments) {
                  if (comment.user?.type === 'Bot') {
                    continue;
                  }

                  const createdCommentMs = timeMs(
                    comment.created_at
                  );
                  const updatedCommentMs = timeMs(
                    comment.updated_at
                  );

                  if (createdCommentMs !== null) {
                    activityCandidates.push({
                      ms: createdCommentMs,
                      source: 'comentario_humano'
                    });
                  }

                  if (
                    updatedCommentMs !== null &&
                    updatedCommentMs !== createdCommentMs
                  ) {
                    activityCandidates.push({
                      ms: updatedCommentMs,
                      source: 'edicion_comentario_humano'
                    });
                  }
                }

                for (const comment of comments) {
                  const commentBody = comment.body || '';

                  if (!commentBody.includes(VALIDATION_MARKER)) {
                    continue;
                  }

                  HUMAN_ACTIVITY_PATTERN.lastIndex = 0;
                  let match;

                  while (
                    (match = HUMAN_ACTIVITY_PATTERN.exec(commentBody))
                  ) {
                    const editMs = timeMs(match[1]);

                    if (editMs !== null) {
                      activityCandidates.push({
                        ms: editMs,
                        source: 'edicion_ticket_humana'
                      });
                    }
                  }
                }

                for (const event of timelineEvents) {
                  if (
                    !HUMAN_TIMELINE_EVENTS.has(event.event) ||
                    event.actor?.type === 'Bot'
                  ) {
                    continue;
                  }

                  const eventMs = timeMs(event.created_at);

                  if (eventMs !== null) {
                    activityCandidates.push({
                      ms: eventMs,
                      source: `timeline:${event.event}`
                    });
                  }
                }

                activityCandidates.sort((a, b) => b.ms - a.ms);

                const lastHumanActivity =
                  activityCandidates[0] || {
                    ms: createdMs,
                    source: 'creacion_issue'
                  };

                const lastHumanActivityMs =
                  lastHumanActivity.ms;

                const inactiveFor =
                  now - lastHumanActivityMs;

                const automationComments = comments
                  .filter(comment =>
                    AUTO_MARKERS.some(marker =>
                      (comment.body || '').includes(marker)
                    )
                  )
                  .sort(
                    (a, b) =>
                      new Date(b.created_at).getTime() -
                      new Date(a.created_at).getTime()
                  );

                const lastAutomation = automationComments[0];
                const lastAutomationMs = lastAutomation
                  ? timeMs(lastAutomation.created_at)
                  : null;

                /*
                 * Si hubo cualquier actividad humana después del
                 * último aviso automático, se aplica la pausa de
                 * siete días desde esa actividad.
                 */
                if (
                  lastAutomationMs !== null &&
                  lastHumanActivityMs > lastAutomationMs
                ) {
                  const pauseUntil =
                    lastHumanActivityMs + PAUSE_MS;

                  if (now < pauseUntil) {
                    counters.pausedByHuman++;

                    writeDecision({
                      issue: issue.number,
                      title: issue.title,
                      decision: 'PAUSADO',
                      reason:
                        'actividad_humana_posterior_al_aviso',
                      priority: priorityLabel,
                      inactiveDays: days(inactiveFor),
                      lastHumanActivity:
                        isoDate(lastHumanActivityMs),
                      lastHumanActivitySource:
                        lastHumanActivity.source,
                      resumeAt: isoDate(pauseUntil)
                    });

                    continue;
                  }
                }

                if (inactiveFor < inactivityMs) {
                  counters.insufficientInactivity++;

                  writeDecision({
                    issue: issue.number,
                    title: issue.title,
                    decision: 'NO_ELEGIBLE',
                    reason: 'inactividad_insuficiente',
                    priority: priorityLabel,
                    inactiveDays: days(inactiveFor),
                    requiredDays: days(inactivityMs),
                    lastHumanActivity:
                      isoDate(lastHumanActivityMs),
                    lastHumanActivitySource:
                      lastHumanActivity.source
                  });

                  continue;
                }

                if (lastAutomationMs !== null) {
                  const pauseUntil =
                    lastAutomationMs + PAUSE_MS;

                  if (now < pauseUntil) {
                    counters.pausedByAutomation++;

                    writeDecision({
                      issue: issue.number,
                      title: issue.title,
                      decision: 'PAUSADO',
                      reason: 'aviso_automatico_reciente',
                      priority: priorityLabel,
                      inactiveDays: days(inactiveFor),
                      lastHumanActivity:
                        isoDate(lastHumanActivityMs),
                      lastHumanActivitySource:
                        lastHumanActivity.source,
                      lastAutomation:
                        isoDate(lastAutomationMs),
                      resumeAt: isoDate(pauseUntil)
                    });

                    continue;
                  }
                }

                const randomValue = Math.random();

                const auditProbability = probability(p);
                const auditRandomValue =
                  probability(randomValue);

                if (randomValue >= p) {
                  counters.randomRejected++;

                  writeDecision({
                    issue: issue.number,
                    title: issue.title,
                    decision: 'NO_ENVIADO',
                    reason: 'sorteo_probabilistico_negativo',
                    priority: priorityLabel,
                    inactiveDays: days(inactiveFor),
                    requiredDays: days(inactivityMs),
                    lastHumanActivity:
                      isoDate(lastHumanActivityMs),
                    lastHumanActivitySource:
                      lastHumanActivity.source,
                    configuredProbability:
                      auditProbability,
                    randomValue: auditRandomValue,
                    mode
                  });

                  continue;
                }

                const daysInactive = Math.floor(
                  inactiveFor / DAY_MS
                );

                const formattedDate =
                  formatArgentinaDate(lastHumanActivityMs);

                const commentBody =
                  mode === 'codex'
                    ? [
                        `<!-- ${CODEX_MARKER} -->`,
                        '🤖 **Revisado por Codex Review**',
                        '',
                        '**Estado:** Inactividad detectada',
                        `**Última actividad humana:** ${formattedDate}`,
                        `**Días sin actividad:** ${daysInactive}`,
                        `**Prioridad:** ${priorityLabel}`,
                        '',
                        '### Análisis',
                        `- ✅ Issue bien definido: "${issue.title}"`,
                        `- 📊 Descripción disponible: ${
                          issue.body ? '✓' : '✗'
                        }`,
                        `- 🏷️ Etiquetas asignadas: ${
                          labels.length > 0
                            ? labels.join(', ')
                            : 'Ninguna'
                        }`,
                        '',
                        '### Acciones sugeridas',
                        '1. 📝 Actualizar el estado o editar el ticket si continúa siendo relevante',
                        '2. 👤 Asignar un responsable si requiere acción inmediata',
                        '3. ✅ Cerrar el issue si ya no aplica',
                        '4. 💬 Dejar un comentario con novedades cuando corresponda',
                        '',
                        '⏸️ Una actividad humana —comentario, edición o cambio de estado/labels— pausa nuevas notificaciones automáticas por **7 días**.',
                        '',
                        `*Revisión automática realizada el ${
                          formatArgentinaDate(now)
                        } por Codex Review Agent*`
                      ].join('\n')
                    : [
                        `<!-- ${REMINDER_MARKER} -->`,
                        '⚠️ **Recordatorio automático por inactividad.**',
                        '',
                        `Prioridad detectada: **${priorityLabel}**.`,
                        '',
                        'Si el incidente sigue vigente, actualizá el estado, editá el ticket o dejá un comentario.',
                        '',
                        '⏸️ Una actividad humana —comentario, edición o cambio de estado/labels— pausa nuevas notificaciones automáticas por **7 días**.'
                      ].join('\n');

                const response =
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    body: commentBody
                  });

                counters.notified++;

                if (mode === 'codex') {
                  counters.codexReviewed++;
                } else {
                  counters.normalNotified++;
                }

                writeDecision({
                  issue: issue.number,
                  title: issue.title,
                  decision: 'ENVIADO',
                  reason: 'seleccion_probabilistica_positiva',
                  priority: priorityLabel,
                  inactiveDays: days(inactiveFor),
                  requiredDays: days(inactivityMs),
                  lastHumanActivity:
                    isoDate(lastHumanActivityMs),
                  lastHumanActivitySource:
                    lastHumanActivity.source,
                  configuredProbability:
                    auditProbability,
                  randomValue: auditRandomValue,
                  mode,
                  commentId: response.data.id,
                  commentUrl: response.data.html_url
                });
              } catch (error) {
                counters.errors++;

                writeDecision({
                  issue: issue.number,
                  title: issue.title,
                  decision: 'ERROR',
                  reason: 'error_al_procesar_issue',
                  priority: priorityLabel,
                  message: error.message
                });

                core.error(
                  `Issue #${issue.number}: ${error.stack || error.message}`
                );
              }
            }

            core.info('========== RESUMEN ==========');

            core.info(
              `Revisados: ${counters.checked}`
            );

            core.info(
              `Avisos enviados: ${counters.notified}`
            );

            core.info(
              `Avisos normales: ${counters.normalNotified}`
            );

            core.info(
              `Revisiones Codex: ${counters.codexReviewed}`
            );

            core.info(
              `Sin prioridad: ${counters.missingPriority}`
            );

            core.info(
              `Inactividad insuficiente: ${
                counters.insufficientInactivity
              }`
            );

            core.info(
              `Pausados por actividad humana: ${
                counters.pausedByHuman
              }`
            );

            core.info(
              `Pausados por aviso automático: ${
                counters.pausedByAutomation
              }`
            );

            core.info(
              `No seleccionados por sorteo: ${
                counters.randomRejected
              }`
            );

            core.info(
              `Errores: ${counters.errors}`
            );

            await core.summary
              .addHeading('Recordatorios de inactividad')
              .addTable([
                [
                  { data: 'Resultado', header: true },
                  { data: 'Cantidad', header: true }
                ],
                ['Issues revisados', String(counters.checked)],
                ['Avisos enviados', String(counters.notified)],
                [
                  'Revisiones Codex',
                  String(counters.codexReviewed)
                ],
                [
                  'Recordatorios normales',
                  String(counters.normalNotified)
                ],
                [
                  'Sin etiqueta de prioridad',
                  String(counters.missingPriority)
                ],
                [
                  'Inactividad insuficiente',
                  String(counters.insufficientInactivity)
                ],
                [
                  'Pausados por actividad humana',
                  String(counters.pausedByHuman)
                ],
                [
                  'Pausados por aviso reciente',
                  String(counters.pausedByAutomation)
                ],
                [
                  'Descartados por sorteo',
                  String(counters.randomRejected)
                ],
                ['Errores', String(counters.errors)]
              ])
              .addHeading('Auditoría de decisiones', 2)
              .addCodeBlock(
                JSON.stringify(auditLog, null, 2),
                'json'
              )
              .write();

            core.info('========== AUDIT_LOG_JSON ==========');
            core.info(JSON.stringify(auditLog, null, 2));

            if (counters.errors > 0) {
              core.setFailed(
                `Se produjeron errores al procesar ${
                  counters.errors
                } issue(s).`
              );
            }
