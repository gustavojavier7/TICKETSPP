name: Manual State Consistency Dispatch Test

on:
  push:
    paths:
      - '.github/manual-state-consistency-test.trigger'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch state-consistency-guard on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run state-consistency-guard.yml \
            --repo "${{ github.repository }}" \
            --ref main
