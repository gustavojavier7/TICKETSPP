name: Assign PP Ticket ID

on:
  issues:
    types:
      - opened
      - edited

permissions:
  issues: write

jobs:
  assign_pp_id:
    name: Formalize and validate ticket
    if: github.event.action == 'opened' || github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest

    steps:
      - name: Build PP ID
        id: pp
        shell: bash
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}
          printf -v PADDED "%04d" "$ISSUE_NUMBER"
          echo "pp_id=PP-${PADDED}" >> "$GITHUB_OUTPUT"

      - name: Prefix issue title with PP ID
        uses: actions/github-script@v8
        env:
          PP_ID: ${{ steps.pp.outputs.pp_id }}
        with:
          script: |
            const issue = context.payload.issue;
            const ppId = process.env.PP_ID;
            const currentTitle = issue.title || '';
            const normalizedPrefix = `[${ppId}]`;

            if (!currentTitle.startsWith(normalizedPrefix)) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                title: `${normalizedPrefix} ${currentTitle}`.trim()
              });
            }

      - name: Validate and formalize ticket
        uses: actions/github-script@v8
        env:
          PP_ID: ${{ steps.pp.outputs.pp_id }}
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || '';
            const ppId = process.env.PP_ID;

            function extractField(heading) {
              const escapedHeading = heading.replace(
                /[.*+?^${}()|[\]\\]/g,
                '\\$&'
              );

              const pattern = new RegExp(
                `(?:^|\\n)###\\s+${escapedHeading}\\s*\\n+([\\s\\S]*?)(?=\\n###\\s+|$)`,
                'i'
              );

              const match = body.match(pattern);

              if (!match) {
                return null;
              }

              const value = match[1]
                .replace(/<!--[\s\S]*?-->/g, '')
                .trim();

              if (
                !value ||
                /^_?no response_?$/i.test(value) ||
                /^none$/i.test(value) ||
                /^n\/?a$/i.test(value) ||
                /^sin datos$/i.test(value)
              ) {
                return null;
              }

              return value;
            }

            function normalize(value) {
              return String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .trim()
                .replace(/\s+/g, ' ')
                .toUpperCase();
            }

            function slugify(value) {
              return String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
            }

            const fields = {
              solicitante: extractField('Solicitante'),
              sistema: extractField('Sistema afectado'),
              descripcion: extractField('DESCRIBE LA FALLA'),
              tipoFalla: extractField('Tipo de falla'),
              prioridad: extractField('PRIORIDAD'),
              estado: extractField('ESTADO DEL TICKET')
            };

            const allowed = {
              solicitante: [
                'GUSTAVO LOPEZ',
                'JENNIFER CASTILLA',
                'EVELIN SOSA',
                'JESUS MARTIN'
              ],

              sistema: [
                'HIKVISION',
                'DIGIFORT',
                'CCURE'
              ],

              prioridad: [
                'BAJA',
                'MEDIA',
                'ALTA',
                'URGENTE'
              ],

              estado: [
                'ABIERTO',
                'EN CURSO',
                'ESPERANDO RESPUESTA',
                'CERRADO'
              ],

              tipoFalla: [
                'SIN CONEXION',
                'SIN GRABACION',
                'FUERA DE FOCO',
                'OBSTRUIDA',
                'FALLA ELECTRICA',
                'FALLA MECANICA',
                'INTERMITENTE',
                'OTRO'
              ]
            };

            const priorityWasDefaulted = !fields.prioridad;
            const priorityIsInvalid = Boolean(
              fields.prioridad &&
              !allowed.prioridad.includes(normalize(fields.prioridad))
            );

            // Fail-safe operativo:
            // una prioridad ausente o inválida nunca deja al ticket
            // fuera del monitoreo. MEDIA es el fallback conservador.
            const effectivePriority =
              priorityWasDefaulted || priorityIsInvalid
                ? 'MEDIA'
                : fields.prioridad;

            const errors = [];

            if (!fields.solicitante) {
              errors.push('Falta el campo **Solicitante**.');
            } else if (
              !allowed.solicitante.includes(normalize(fields.solicitante))
            ) {
              errors.push(
                `El valor de **Solicitante** no es válido: \`${fields.solicitante}\`.`
              );
            }

            if (!fields.sistema) {
              errors.push('Falta el campo **Sistema afectado**.');
            } else if (
              !allowed.sistema.includes(normalize(fields.sistema))
            ) {
              errors.push(
                `El valor de **Sistema afectado** no es válido: \`${fields.sistema}\`.`
              );
            }

            if (!fields.descripcion) {
              errors.push('Falta el campo **DESCRIBE LA FALLA**.');
            } else {
              const normalizedDescription = normalize(fields.descripcion);

              if (
                normalizedDescription.length < 10 ||
                ['NO FUNCIONA', 'FALLA', 'REVISAR'].includes(
                  normalizedDescription
                )
              ) {
                errors.push(
                  'La **Descripción de la falla** es demasiado breve o imprecisa.'
                );
              }
            }

            if (priorityIsInvalid) {
              errors.push(
                `El valor de **PRIORIDAD** no es válido: \`${fields.prioridad}\`. ` +
                'Se aplicó provisionalmente `MEDIA` para mantener el ticket dentro del monitoreo.'
              );
            }

            if (!fields.estado) {
              errors.push('Falta el campo **ESTADO DEL TICKET**.');
            } else if (
              !allowed.estado.includes(normalize(fields.estado))
            ) {
              errors.push(
                `El valor de **ESTADO DEL TICKET** no es válido: \`${fields.estado}\`.`
              );
            }

            if (
              fields.tipoFalla &&
              !allowed.tipoFalla.includes(normalize(fields.tipoFalla))
            ) {
              errors.push(
                `El valor de **Tipo de falla** no es válido: \`${fields.tipoFalla}\`.`
              );
            }

            const labelsToAdd = [
              'tipo:registrar-ticket'
            ];

            const priorityLabels = {
              BAJA: 'prioridad:baja',
              MEDIA: 'prioridad:media',
              ALTA: 'prioridad:alta',
              URGENTE: 'prioridad:urgente'
            };

            const stateLabels = {
              ABIERTO: 'estado:abierto',
              'EN CURSO': 'estado:en-curso',
              'ESPERANDO RESPUESTA': 'estado:esperando-respuesta',
              CERRADO: 'estado:cerrado'
            };

            const systemLabels = {
              HIKVISION: 'sistema:hikvision',
              DIGIFORT: 'sistema:digifort',
              CCURE: 'sistema:ccure'
            };

            const normalizedPriority = normalize(effectivePriority);
            const normalizedState = normalize(fields.estado);
            const normalizedSystem = normalize(fields.sistema);

            labelsToAdd.push(priorityLabels[normalizedPriority]);

            if (stateLabels[normalizedState]) {
              labelsToAdd.push(stateLabels[normalizedState]);
            }

            if (systemLabels[normalizedSystem]) {
              labelsToAdd.push(systemLabels[normalizedSystem]);
            }

            if (fields.solicitante) {
              labelsToAdd.push(
                `solicitante:${slugify(fields.solicitante)}`
              );
            }

            const validationLabel = 'validacion:incompleta';

            if (errors.length > 0) {
              labelsToAdd.push(validationLabel);

              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: validationLabel
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }

                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    name: validationLabel,
                    color: 'd73a4a',
                    description: 'Ticket con campos pendientes de corrección'
                  });
                } catch (createError) {
                  // 422 puede significar que otra ejecución creó
                  // la label entre el GET y el CREATE.
                  if (createError.status !== 422) {
                    throw createError;
                  }
                }
              }
            }

            const managedPrefixes = [
              'prioridad:',
              'estado:',
              'sistema:',
              'solicitante:',
              'validacion:'
            ];

            const existingLabels = (issue.labels || [])
              .map(label =>
                typeof label === 'string' ? label : label.name
              )
              .filter(Boolean);

            const preservedLabels = existingLabels.filter(label =>
              !managedPrefixes.some(prefix =>
                label.toLowerCase().startsWith(prefix)
              )
            );

            const finalLabels = [
              ...new Set([
                ...preservedLabels,
                ...labelsToAdd
              ])
            ];

            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: finalLabels
            });

            const validationMarker =
              '<!-- codex-connector-ticket-validation-v1 -->';

            const isHumanEdit =
              context.payload.action === 'edited' &&
              context.payload.sender?.type !== 'Bot';

            const humanActivityMarker = isHumanEdit
              ? `<!-- human-activity-v1:${new Date(
                  issue.updated_at || Date.now()
                ).toISOString()} -->`
              : null;

            const priorityFallbackNote = priorityWasDefaulted
              ? 'ℹ️ **Prioridad asignada automáticamente:** `MEDIA` (`prioridad:media`) porque el ticket no definía una prioridad.'
              : priorityIsInvalid
                ? `⚠️ **Prioridad provisional:** el valor \`${fields.prioridad}\` no es válido. Se asignó \`MEDIA\` (\`prioridad:media\`) para que el ticket no quede fuera del monitoreo hasta que se corrija.`
                : null;

            let commentBody;

            if (errors.length > 0) {
              commentBody = [
                validationMarker,
                humanActivityMarker,
                `⚠️ **Codex-Connector: validación incompleta**`,
                '',
                `El ticket **${ppId}** fue creado o actualizado, pero no pudo formalizarse completamente.`,
                '',
                priorityFallbackNote,
                priorityFallbackNote ? '' : null,
                `Etiqueta de seguimiento aplicada: \`${validationLabel}\`.`,
                '',
                '### Datos que deben corregirse',
                ...errors.map(error => `- ${error}`),
                '',
                'Editá el contenido del ticket y corregí los campos indicados.',
                '',
                'Al guardar la edición, Codex-Connector volverá a validar y sincronizar las etiquetas automáticamente.',
                '',
                'El ticket seguirá dentro del monitoreo de inactividad con la prioridad operativa disponible.'
              ].filter(Boolean).join('\n');
            } else {
              const tipoFallaStatus = fields.tipoFalla
                ? `\`${fields.tipoFalla}\``
                : 'no informado — opcional';

              const priorityStatus = priorityWasDefaulted
                ? '`MEDIA` — asignada automáticamente'
                : `\`${fields.prioridad}\``;

              commentBody = [
                validationMarker,
                humanActivityMarker,
                `✅ **Codex-Connector: ticket formalizado**`,
                '',
                `Identificador asignado: **${ppId}**`,
                '',
                '### Validación',
                `- Solicitante: \`${fields.solicitante}\``,
                `- Sistema afectado: \`${fields.sistema}\``,
                `- Prioridad: ${priorityStatus}`,
                `- Estado: \`${fields.estado}\``,
                `- Tipo de falla: ${tipoFallaStatus}`,
                `- Descripción: válida`,
                '',
                priorityFallbackNote,
                priorityFallbackNote ? '' : null,
                'Las etiquetas operativas fueron sincronizadas automáticamente.'
              ].filter(Boolean).join('\n');
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                per_page: 100
              }
            );

            const validationComment = comments
              .filter(comment =>
                (comment.body || '').includes(validationMarker)
              )
              .sort(
                (a, b) =>
                  new Date(b.created_at).getTime() -
                  new Date(a.created_at).getTime()
              )[0];

            if (validationComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: validationComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: commentBody
              });
            }
