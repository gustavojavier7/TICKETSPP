name: "Registrar ticket rápido"
description: "Alta operativa de tickets de cámaras e infraestructura."
title: "[TICKET] "
labels:
  - "tipo:registrar-ticket"
  - "estado:abierto"

body:
  - type: markdown
    attributes:
      value: |
        Complete los campos obligatorios para registrar el ticket operativo.

        Una vez creado, Codex-Connector validará los campos y valores
        necesarios para formalizarlo en el sistema.

  - type: dropdown
    id: solicitante
    attributes:
      label: Solicitante
      description: "Persona que informa o registra la falla."
      options:
        - Gustavo López
        - Jennifer Castilla
        - Evelin Sosa
        - Jesús Martín
    validations:
      required: true

  - type: dropdown
    id: sistema_afectado
    attributes:
      label: Sistema afectado
      description: "Sistema o plataforma relacionada con la falla."
      options:
        - HIKVISION
        - DIGIFORT
        - CCURE
    validations:
      required: true

  - type: textarea
    id: describe_falla
    attributes:
      label: DESCRIBE LA FALLA
      description: "En la primera línea incluí el resumen corto que irá al título."
      placeholder: |
        REF: 3099: HIKVISION 1 CAM 6 PASILLO LN sin conexión
        Detalle completo de la falla observada...
    validations:
      required: true

  - type: dropdown
    id: tipo_falla
    attributes:
      label: Tipo de falla
      description: "Seleccione la categoría que mejor represente la falla."
      options:
        - Sin conexión
        - Sin grabación
        - Fuera de foco
        - Obstruida
        - Falla eléctrica
        - Falla mecánica
        - Intermitente
        - Otro
    validations:
      required: false

  - type: dropdown
    id: prioridad
    attributes:
      label: PRIORIDAD
      description: "Nivel de urgencia operativa del ticket."
      options:
        - BAJA
        - MEDIA
        - ALTA
        - URGENTE
    validations:
      required: true

  - type: dropdown
    id: estado_ticket
    attributes:
      label: ESTADO DEL TICKET
      description: "Estado administrativo inicial del ticket."
      options:
        - ABIERTO
        - EN CURSO
        - ESPERANDO RESPUESTA
        - CERRADO
      default: 0
    validations:
      required: true

  - type: checkboxes
    id: escalamiento_condicional
    attributes:
      label: ESCALAMIENTO CONDICIONAL
      options:
        - label: Respuesta del Proveedor recibida
        - label: Requiere reemplazos
        - label: Requiere visita en sitio
        - label: Requiere CAPEX
        - label: Bloqueado por tercero

  - type: textarea
    id: detalles_notas
    attributes:
      label: Detalles o notas
      placeholder: "Ej.: Cableado obsoleto. Se incluye en CAPEX 2026."

  - type: input
    id: link_referencia
    attributes:
      label: Link
      description: "URL de referencia, correo, imagen o documento relacionado."
      placeholder: "https://..."

  - type: input
    id: id_ticket_externo
    attributes:
      label: ID Ticket
      description: "Ej.: PP-0005, si existe en un sistema externo."
      placeholder: "PP-0000"

  - type: input
    id: estado_anterior
    attributes:
      label: Estado Anterior
      description: "Solo para uso administrativo o histórico."
      placeholder: "ABIERTO / EN CURSO / ESPERANDO RESPUESTA / CERRADO"

  - type: markdown
    attributes:
      value: |
        Campos automáticos en GitHub:

        - Identificador PP: asignado después de crear el ticket.
        - Marca temporal: `created_at`.
        - Fecha del último cambio: `updated_at`.
        - Etiquetas operativas: asignadas por Codex-Connector.
